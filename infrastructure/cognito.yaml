AWSTemplateFormatVersion: '2010-09-09'
Description: Cognito user pool and OAuth client for the Brand Auto-Tracking development environment.
Parameters:
  DomainPrefix:
    Type: String
    Description: Unique Cognito hosted-login domain prefix; choose before deployment.
    AllowedPattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    MinLength: 1
    MaxLength: 63
  CallbackUrl:
    Type: String
    Default: http://localhost:5173/auth/callback
    Description: Exact OAuth callback URL. Localhost is for development only.
  LogoutUrl:
    Type: String
    Default: http://localhost:5173/
    Description: Exact logout redirect URL. Localhost is for development only.
  TestCallbackUrl:
    Type: String
    Default: http://localhost:15173/auth/callback
    Description: Additional callback for isolated local browser tests.
  TestLogoutUrl:
    Type: String
    Default: http://localhost:15173/
    Description: Additional sign-out URL for isolated local browser tests.
  DemoCallbackUrl:
    Type: String
    Default: ''
    Description: Optional exact HTTPS callback URL for the hosted demo.
  DemoLogoutUrl:
    Type: String
    Default: ''
    Description: Optional exact HTTPS logout URL for the hosted demo.
Conditions:
  HasDemoCallback: !Not [!Equals [!Ref DemoCallbackUrl, '']]
  HasDemoLogout: !Not [!Equals [!Ref DemoLogoutUrl, '']]
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  ApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: brand-api
      Name: Brand tracking API
      Scopes:
        - ScopeName: access
          ScopeDescription: Access the signed-in user's brand data
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-web'
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, 'brand-api/access']
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref CallbackUrl, !Ref TestCallbackUrl, !If [HasDemoCallback, !Ref DemoCallbackUrl, !Ref 'AWS::NoValue']]
      LogoutURLs: [!Ref LogoutUrl, !Ref TestLogoutUrl, !If [HasDemoLogout, !Ref DemoLogoutUrl, !Ref 'AWS::NoValue']]
      PreventUserExistenceErrors: ENABLED
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref WebClient
  Issuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
  LoginDomain:
    Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiScope:
    Value: brand-api/access
