services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: brand_tracking
      POSTGRES_USER: brand_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brand_app -d brand_tracking"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
